services:
  backend:
    build:
      context: .
      dockerfile: backend-rust/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///app/data/portal.db}
      # SEC-001: JWT_SECRET has NO default. docker compose will fail loudly
      # if not set, which is the intended behavior.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required. Generate with openssl rand -hex 64}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-8h}"
      PORT: 3000
      CORS_ORIGIN: "${CORS_ORIGIN:?CORS_ORIGIN is required in production}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      # SEC-001: SEED_ADMIN_* are optional. If unset, no admin is seeded.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      MEDIA_DIR: /app/media
      UPLOAD_DIR: /app/data/uploads
      SEED_DATA_DIR: /app/seed-data
    volumes:
      - tivit-db:/app/data
      - tivit-media:/app/media
    networks:
      - tivit
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # SEC-003: Redis protected by a password (set REDIS_PASSWORD in .env).
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass \"$$REDIS_PASSWORD\" --bind 0.0.0.0;
        else
          redis-server --bind 0.0.0.0 --protected-mode no;
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - tivit
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SHOW_DEMO_CREDENTIALS: ${VITE_SHOW_DEMO_CREDENTIALS:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - tivit-media:/usr/share/nginx/html/media-cms:ro
    networks:
      - tivit
    # FIX-006: Healthcheck now hits the nginx root, not a backend endpoint
    # (which doesn't exist on the frontend container).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

volumes:
  tivit-db:
  tivit-media:

networks:
  tivit:
