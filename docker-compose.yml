services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/dev.db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SEED_USERS: ${SEED_USERS:-true}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - tivit-db:/data
    networks:
      - tivit

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - tivit

volumes:
  tivit-db:

networks:
  tivit:
